<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaya Chat Agency - Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar-capsule" aria-label="Main Navigation">
      <a href="#home" class="site-logo-link" aria-label="Kaya Chat Home">
        <img src="http://kayachatagency.com/wp-content/uploads/2026/11/logo-kaya.webp" alt="Kaya Chat Logo" width="38" height="38" class="site-logo">
      </a>
      <ul class="nav-menu">
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#agent-vs-host" class="nav-link">Host</a></li>
        <li><a href="#agency-registration" class="nav-link">Agent</a></li>
        <li><a href="#tutorial" class="nav-link">Withdraw</a></li>
        <li><a href="#footer" class="nav-link">Contact</a></li>
      </ul>
      <button type="button" class="nav-toggle-btn" id="headerNavToggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
    <div class="mobile-nav-drawer" id="headerMobileNav" aria-hidden="true">
      <a href="#home" class="nav-link mobile-link">Home</a>
      <a href="#agent-vs-host" class="nav-link mobile-link">Host</a>
      <a href="#agency-registration" class="nav-link mobile-link">Agent</a>
      <a href="#tutorial" class="nav-link mobile-link">Withdraw</a>
      <a href="#footer" class="nav-link mobile-link">Contact</a>
    </div>
  </header>

  <script>
    (function () {
      var navToggle = document.getElementById('headerNavToggle');
      var mobileNav = document.getElementById('headerMobileNav');
      var mobileLinks = document.querySelectorAll('.mobile-link');

      if (navToggle && mobileNav) {
        navToggle.addEventListener('click', function () {
          var isOpen = mobileNav.classList.toggle('open');
          navToggle.classList.toggle('active', isOpen);
          navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          mobileNav.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
        });

        mobileLinks.forEach(function (link) {
          link.addEventListener('click', function () {
            mobileNav.classList.remove('open');
            navToggle.classList.remove('active');
            navToggle.setAttribute('aria-expanded', 'false');
            mobileNav.setAttribute('aria-hidden', 'true');
          });
        });
      }
    })();
  </script>
</body>
</html>
